# BioGPT runner for the benchmark (not an Ollama/GGUF model): CPU PyTorch + transformers.
# Install: .sam/bin/pixi install --manifest-path bench/hf/pixi.toml
[workspace]
name = "sam-bench-hf"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pytorch-cpu = ">=2.6"
transformers = ">=4.46"
sacremoses = "*"
